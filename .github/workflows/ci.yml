name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same pull request cancels the first — nobody needs the
# result of a commit that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # plugin.test.ts checks every bookmaker folder is complete and registered
      # in all three collectors; manifest.test.ts checks the sites the extension
      # asks to be injected into are the ones a capture rule recognises. Both
      # failures are silent at runtime, which is why they are gates here.
      - run: pnpm test

      - run: pnpm build

      # Proof the extension still loads, not just that it compiled. The version
      # is checked with it: a store rejects an upload whose version has not
      # moved, and the number a reader reports a bug against is this one.
      - name: manifest survived the build, and says the same version
        run: |
          node -e '
            const read = (p) => JSON.parse(require("fs").readFileSync(p, "utf8"));
            const built = read("extension/dist/manifest.json").version;
            const pkg = read("package.json").version;
            if (built !== pkg) {
              console.error("::error::manifest.json says " + built + ", package.json says " + pkg);
              process.exit(1);
            }
            console.log("manifest ok, version " + built);
          '

      - uses: actions/upload-artifact@v7
        with:
          name: extension-dist
          path: extension/dist
          retention-days: 7
