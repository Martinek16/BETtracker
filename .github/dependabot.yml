version: 2
updates:
  # Grouped and monthly on purpose. This is a browser extension that talks to a
  # handful of pinned APIs, not a server — a weekly flood of individual bumps
  # would be noise that trains everyone to ignore the alerts that matter.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      dev:
        dependency-type: development
      prod:
        dependency-type: production
    # A major is breaking work, not maintenance, and grouping one in chains a
    # dozen safe bumps to it: the whole PR then fails and nothing lands. Majors
    # are taken deliberately, one at a time, by hand.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore'
